[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-yaml" },
    { id = "check-toml" },
    { id = "check-json" },
    { id = "pretty-format-json", args = ["--autofix"] },
    { id = "mixed-line-ending" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.3"
hooks = [{ id = "ruff-check", args = ["--fix"] }, { id = "ruff-format" }]
