name: CI
on:
  - push
  - pull_request

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff format --check

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - run: just pre-commit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - run: just lint

  test-os:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - run: just test

  test-python:
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - run: just test
        env:
          UV_PYTHON: ${{ matrix.python-version }}

  #   test:
  #     runs-on: ubuntu-latest
  #     strategy:
  #       fail-fast: false
  #       matrix:
  #         python-version:
  #           - "3.10"
  #           - "3.11"
  #           - "3.12"
  #           - "3.13"
  #           - "3.14"
  #     steps:
  #       - uses: actions/checkout@v7
  #       - uses: astral-sh/setup-uv@v9.0.0
  #         with:
  #           enable-cache: false
  #           python-version: ${{ matrix.python-version }}
  #       - uses: extractions/setup-just@v4
  #       - run: just test

  publish:
    runs-on: ubuntu-latest
    if: startsWith(github.event.ref, 'refs/tags/v')
    needs: [format, lint]
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv python install 3.12
      - run: uv build
      - run: uv publish
