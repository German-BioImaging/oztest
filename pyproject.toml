[project]
name = "ozconf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Chris Barnes", email = "chris.barnes@gerbi-gmb.de" }]
requires-python = ">=3.10"
dependencies = [
    "packaging>=26.2",
    "rich>=15.0.0",
    "tomli>=2.4.1",
    "typer>=0.26.7",
]

[dependency-groups]
dev = ["mypy>=2.1.0", "prek>=0.4.5", "ruff>=0.15.17"]

[project.scripts]
ozconf = "ozconf.cli.ozconf:app"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
ozconf = "src/ozconf"
"ozconf.cases" = "cases"
